<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270"><rect width="1200" height="270" rx="16" fill="#0d1117"/><path d="M0 60H1200" stroke="#30363d"/><g font-family="Arial,Helvetica,sans-serif"><text x="32" y="38" fill="#c9d1d9" font-size="17" font-weight="700">engineering-principles</text><text x="1168" y="38" fill="#8b949e" font-size="14" text-anchor="end">THE OPERATING SYSTEM</text><g fill="#161b22" stroke="#30363d"><rect x="28" y="86" width="356" height="150" rx="10"/><rect x="422" y="86" width="356" height="150" rx="10"/><rect x="816" y="86" width="356" height="150" rx="10"/></g><g fill="#7ee787" font-size="14" font-family="Consolas,monospace" font-weight="700"><text x="54" y="120">01 / START WITH PEOPLE</text><text x="448" y="120">02 / KEEP IT LEGIBLE</text><text x="842" y="120">03 / EARN RELIABILITY</text></g><g fill="#f0f6fc" font-size="21" font-weight="700"><text x="54" y="158">Build what helps.</text><text x="448" y="158">Make the system</text><text x="448" y="184">easy to follow.</text><text x="842" y="158">Design for the day</text><text x="842" y="184">things go wrong.</text></g><g fill="#8b949e" font-size="15"><text x="54" y="202">A real problem is the brief.</text><text x="448" y="210">Future builders are users too.</text><text x="842" y="210">Then watch, learn and improve.</text></g></g></svg>
