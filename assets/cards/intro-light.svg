<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 262" width="1200" height="262" role="img" aria-label="I build end-to-end digital products across mobile, web, backend systems and applied AI, with an emphasis on architecture, usability, reliability and real-world deployment.">
  <title>Intro</title>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#15120F" fill-opacity="0.13"/></pattern>
    <pattern id="stripes" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4.5" height="9" fill="#15120F"/></pattern>
  </defs>
  <style>
    text{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;}
    @keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
    @keyframes grow{from{transform:scaleX(.45)}to{transform:scaleX(1)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .wiggle{transform-box:fill-box;transform-origin:center;animation:wiggle 2.4s ease-in-out infinite}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.9,.2,1) both}
    .bob{animation:bob 3s ease-in-out infinite}
    @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
  </style>
  <rect x="2" y="2" width="1196" height="258" rx="22" fill="#FFF3D6" stroke="#15120F" stroke-width="4"/>
  <rect x="4" y="4" width="1192" height="254" rx="20" fill="url(#dots)"/>
  <path d="M1168 16 Q1168 26 1178 26 Q1168 26 1168 36 Q1168 26 1158 26 Q1168 26 1168 16Z" fill="#FFD84D" stroke="#15120F" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M24 231 Q24 240 33 240 Q24 240 24 249 Q24 240 15 240 Q24 240 24 231Z" fill="#7FE3B4" stroke="#15120F" stroke-width="2.2" stroke-linejoin="round"/>
  <g transform="rotate(-0.2 600.0 131.0)">
    <rect x="41" y="41" width="1132" height="194" rx="16" fill="#15120F"/>
    <rect x="34" y="34" width="1132" height="194" rx="16" fill="#FFFFFF" stroke="#15120F" stroke-width="3.5"/>
  <path d="M68 92 q0 -22 18 -28 l2 8 q-9 3 -9 12 h10 v18 h-21z" fill="#FFD84D" stroke="#15120F" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M108 92 q0 -22 18 -28 l2 8 q-9 3 -9 12 h10 v18 h-21z" fill="#FFD84D" stroke="#15120F" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="600.0" y="118" font-size="26" font-weight="700" fill="#15120F" text-anchor="middle" textLength="655" lengthAdjust="spacingAndGlyphs">I build end-to-end digital products across</text>
  <rect x="76.0" y="134" width="699" height="40" rx="8" fill="#FFD84D" stroke="#15120F" stroke-width="2.6" transform="rotate(-0.6 411.5 154)"/>
  <text x="90.0" y="162" font-size="26" font-weight="800" fill="#15120F" textLength="671" lengthAdjust="spacingAndGlyphs">mobile, web, backend systems and applied AI</text>
  <text x="781.0" y="162" font-size="26" font-weight="700" fill="#15120F" textLength="343" lengthAdjust="spacingAndGlyphs"> - with an emphasis on</text>
  <text x="600.0" y="204" font-size="26" font-weight="700" fill="#15120F" text-anchor="middle" textLength="983" lengthAdjust="spacingAndGlyphs">architecture, usability, reliability and real-world deployment.</text>
  </g>
</svg>
