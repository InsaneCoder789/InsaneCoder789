<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 304" width="1200" height="304" role="img" aria-label="Engineering principles: start with people, keep it legible, earn reliability">
  <title>Engineering principles</title>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#15120F" fill-opacity="0.13"/></pattern>
    <pattern id="stripes" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4.5" height="9" fill="#15120F"/></pattern>
  </defs>
  <style>
    text{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;}
    @keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
    @keyframes grow{from{transform:scaleX(.45)}to{transform:scaleX(1)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .wiggle{transform-box:fill-box;transform-origin:center;animation:wiggle 2.4s ease-in-out infinite}
    .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.9,.2,1) both}
    .bob{animation:bob 3s ease-in-out infinite}
    @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
  </style>
  <rect x="2" y="2" width="1196" height="300" rx="22" fill="#FFF3D6" stroke="#15120F" stroke-width="4"/>
  <rect x="4" y="4" width="1192" height="296" rx="20" fill="url(#dots)"/>
  <path d="M1170 20 Q1170 30 1180 30 Q1170 30 1170 40 Q1170 30 1160 30 Q1170 30 1170 20Z" fill="#FF9BBF" stroke="#15120F" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M22 273 Q22 282 31 282 Q22 282 22 291 Q22 282 13 282 Q22 282 22 273Z" fill="#FFD84D" stroke="#15120F" stroke-width="2.2" stroke-linejoin="round"/>
  <g transform="rotate(-0.7 214.0 161.0)">
    <rect x="41" y="59" width="360" height="218" rx="16" fill="#15120F"/>
    <rect x="34" y="52" width="360" height="218" rx="16" fill="#FFD84D" stroke="#15120F" stroke-width="3.5"/>
  <g class="bob" style="animation-delay:0.0s"><polygon points="84.0,26.0 92.0,36.1 104.0,31.4 105.9,44.1 118.6,46.0 113.9,58.0 124.0,66.0 113.9,74.0 118.6,86.0 105.9,87.9 104.0,100.6 92.0,95.9 84.0,106.0 76.0,95.9 64.0,100.6 62.1,87.9 49.4,86.0 54.1,74.0 44.0,66.0 54.1,58.0 49.4,46.0 62.1,44.1 64.0,31.4 76.0,36.1" fill="#15120F"/><polygon points="84.0,26.0 92.0,36.1 104.0,31.4 105.9,44.1 118.6,46.0 113.9,58.0 124.0,66.0 113.9,74.0 118.6,86.0 105.9,87.9 104.0,100.6 92.0,95.9 84.0,106.0 76.0,95.9 64.0,100.6 62.1,87.9 49.4,86.0 54.1,74.0 44.0,66.0 54.1,58.0 49.4,46.0 62.1,44.1 64.0,31.4 76.0,36.1" fill="#15120F" stroke="#15120F" stroke-width="3" stroke-linejoin="round"/><text x="84" y="73" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#FFD84D" text-anchor="middle">01</text></g>
  <text x="142" y="78" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700" letter-spacing="1.4" fill="#15120F">START WITH PEOPLE</text>
  <text x="62" y="140" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27.0" font-weight="900" fill="#15120F" textLength="303" lengthAdjust="spacingAndGlyphs">Build what helps.</text>
  <rect x="65" y="209" width="280" height="38" rx="9" fill="#15120F"/>
  <rect x="62" y="206" width="280" height="38" rx="9" fill="#FFFFFF" stroke="#15120F" stroke-width="2.8"/>
  <text x="76" y="230" font-size="15" font-weight="700" fill="#15120F" textLength="252" lengthAdjust="spacingAndGlyphs">A real problem is the brief.</text>
  </g>
  <g transform="rotate(0.5 602.0 161.0)">
    <rect x="429" y="59" width="360" height="218" rx="16" fill="#15120F"/>
    <rect x="422" y="52" width="360" height="218" rx="16" fill="#7FE3B4" stroke="#15120F" stroke-width="3.5"/>
  <g class="bob" style="animation-delay:0.4s"><polygon points="472.0,26.0 480.0,36.1 492.0,31.4 493.9,44.1 506.6,46.0 501.9,58.0 512.0,66.0 501.9,74.0 506.6,86.0 493.9,87.9 492.0,100.6 480.0,95.9 472.0,106.0 464.0,95.9 452.0,100.6 450.1,87.9 437.4,86.0 442.1,74.0 432.0,66.0 442.1,58.0 437.4,46.0 450.1,44.1 452.0,31.4 464.0,36.1" fill="#15120F"/><polygon points="472.0,26.0 480.0,36.1 492.0,31.4 493.9,44.1 506.6,46.0 501.9,58.0 512.0,66.0 501.9,74.0 506.6,86.0 493.9,87.9 492.0,100.6 480.0,95.9 472.0,106.0 464.0,95.9 452.0,100.6 450.1,87.9 437.4,86.0 442.1,74.0 432.0,66.0 442.1,58.0 437.4,46.0 450.1,44.1 452.0,31.4 464.0,36.1" fill="#15120F" stroke="#15120F" stroke-width="3" stroke-linejoin="round"/><text x="472" y="73" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#7FE3B4" text-anchor="middle">02</text></g>
  <text x="530" y="78" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700" letter-spacing="1.4" fill="#15120F">KEEP IT LEGIBLE</text>
  <text x="450" y="140" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27.0" font-weight="900" fill="#15120F" textLength="267" lengthAdjust="spacingAndGlyphs">Make the system</text>
  <text x="450" y="174" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27.0" font-weight="900" fill="#15120F" textLength="267" lengthAdjust="spacingAndGlyphs">easy to follow.</text>
  <rect x="453" y="209" width="298" height="38" rx="9" fill="#15120F"/>
  <rect x="450" y="206" width="298" height="38" rx="9" fill="#FFFFFF" stroke="#15120F" stroke-width="2.8"/>
  <text x="464" y="230" font-size="15" font-weight="700" fill="#15120F" textLength="270" lengthAdjust="spacingAndGlyphs">Future builders are users too.</text>
  </g>
  <g transform="rotate(-0.5 990.0 161.0)">
    <rect x="817" y="59" width="360" height="218" rx="16" fill="#15120F"/>
    <rect x="810" y="52" width="360" height="218" rx="16" fill="#FF9BBF" stroke="#15120F" stroke-width="3.5"/>
  <g class="bob" style="animation-delay:0.8s"><polygon points="860.0,26.0 868.0,36.1 880.0,31.4 881.9,44.1 894.6,46.0 889.9,58.0 900.0,66.0 889.9,74.0 894.6,86.0 881.9,87.9 880.0,100.6 868.0,95.9 860.0,106.0 852.0,95.9 840.0,100.6 838.1,87.9 825.4,86.0 830.1,74.0 820.0,66.0 830.1,58.0 825.4,46.0 838.1,44.1 840.0,31.4 852.0,36.1" fill="#15120F"/><polygon points="860.0,26.0 868.0,36.1 880.0,31.4 881.9,44.1 894.6,46.0 889.9,58.0 900.0,66.0 889.9,74.0 894.6,86.0 881.9,87.9 880.0,100.6 868.0,95.9 860.0,106.0 852.0,95.9 840.0,100.6 838.1,87.9 825.4,86.0 830.1,74.0 820.0,66.0 830.1,58.0 825.4,46.0 838.1,44.1 840.0,31.4 852.0,36.1" fill="#15120F" stroke="#15120F" stroke-width="3" stroke-linejoin="round"/><text x="860" y="73" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#FF9BBF" text-anchor="middle">03</text></g>
  <text x="918" y="78" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700" letter-spacing="1.4" fill="#15120F">EARN RELIABILITY</text>
  <text x="838" y="140" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25.6" font-weight="900" fill="#15120F" textLength="304" lengthAdjust="spacingAndGlyphs">Design for the day</text>
  <text x="838" y="174" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27.0" font-weight="900" fill="#15120F" textLength="285" lengthAdjust="spacingAndGlyphs">things go wrong.</text>
  <rect x="841" y="209" width="298" height="38" rx="9" fill="#15120F"/>
  <rect x="838" y="206" width="298" height="38" rx="9" fill="#FFFFFF" stroke="#15120F" stroke-width="2.8"/>
  <text x="852" y="230" font-size="15" font-weight="700" fill="#15120F" textLength="270" lengthAdjust="spacingAndGlyphs">Then watch, learn and improve.</text>
  </g>
</svg>
