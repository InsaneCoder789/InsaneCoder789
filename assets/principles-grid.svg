<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240"><rect width="1200" height="240" rx="16" fill="#0d1117"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="45" fill="#8b949e" font-size="14" font-weight="700" letter-spacing="2">ENGINEERING PRINCIPLES</text><g fill="#161b22" stroke="#30363d"><rect x="30" y="70" width="365" height="135" rx="10"/><rect x="418" y="70" width="365" height="135" rx="10"/><rect x="806" y="70" width="365" height="135" rx="10"/></g><g fill="#7ee787" font-size="16" font-weight="700"><text x="55" y="105">01 / BUILD FOR USERS</text><text x="443" y="105">02 / MAKE IT CLEAR</text><text x="831" y="105">03 / SHIP WITH CARE</text></g><g fill="#c9d1d9" font-size="16"><text x="55" y="140">Solve real problems, not</text><text x="55" y="166">just demo-day problems.</text><text x="443" y="140">Keep architecture readable</text><text x="443" y="166">and failure paths deliberate.</text><text x="831" y="140">Observe, learn and improve</text><text x="831" y="166">after every release.</text></g></g></svg>
